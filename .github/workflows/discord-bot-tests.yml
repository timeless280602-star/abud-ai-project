name: Discord bot regression checks

on:
  pull_request:
    paths:
      - 'app/**'
      - 'tests/test_discord_*.py'
      - 'tests/test_creator_notifications.py'
      - 'requirements*.txt'
      - 'Dockerfile.bot'
      - '.github/workflows/discord-bot-tests.yml'

permissions:
  contents: read

concurrency:
  group: discord-bot-{{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ABUD_DATABASE_PATH: /tmp/abud-discord-ci.db
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-bot.txt
      - name: Install backend and bot dependencies
        run: python -m pip install -r requirements.txt -r requirements-bot.txt
      - name: Run remaining Discord bot and dashboard contracts
        run: |
          python -m unittest discover -s tests -p 'test_discord_*.py' -v
          python -m unittest discover -s tests -p 'test_creator_notifications.py' -v
      - name: Compile backend and bot modules
        run: python -m compileall -q app
      - name: Build Discord bot image
        run: docker build -f Dockerfile.bot -t abud-discord-bot:ci .
