name: Discord voice contracts

on:
  pull_request:
    paths:
      - 'app/**'
      - 'tests/test_*.py'
      - 'requirements*.txt'
      - 'Dockerfile.bot'
      - 'compose.voice.yaml'
      - '.github/workflows/discord-voice-tests.yml'
  push:
    branches: [feat/discord-voice-channel]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discord-voice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ABUD_DATABASE_PATH: /tmp/abud-discord-ci.db
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-bot.txt
      - name: Install audio runtime and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libopus0
          python -m pip install -r requirements.txt -r requirements-bot.txt
      - name: Run backend and voice lifecycle tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build bot image and verify the voice runtime without a Discord login
        run: |
          cp .env.example .env
          ABUD_INTERNAL_API_KEY=ci-config-only docker compose -f compose.yaml -f compose.voice.yaml config --quiet
          docker build -f Dockerfile.bot -t abud-discord-voice:test .
          docker run --rm --network none --entrypoint python abud-discord-voice:test -c \
            'import discord, davey; from discord.ext import voice_recv; from discord.opus import Decoder; Decoder(); print(discord.__version__, davey.__version__, voice_recv.__version__)'
