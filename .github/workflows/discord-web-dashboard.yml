name: Discord web dashboard
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'app/web_discord.py'
      - 'app/discord_dashboard.py'
      - 'app/main.py'
      - 'app/bot.py'
      - 'tests/test_discord_dashboard.py'
      - '.github/workflows/discord-web-dashboard.yml'
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run build
