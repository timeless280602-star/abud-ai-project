name: Highest HQ checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -c "import unittest; suite=unittest.defaultTestLoader.discover('tests', pattern='test_highest*.py'); count=suite.countTestCases(); print(f'Highest tests discovered={count}'); assert count > 0, 'No Highest regression tests discovered'"
      - run: python -m unittest discover -s tests -p 'test_highest*.py' -v
      - run: python -m compileall -q app
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app/highest_web/ui.js
      - run: npm install --no-audit --no-fund && npm run build
        working-directory: frontend
