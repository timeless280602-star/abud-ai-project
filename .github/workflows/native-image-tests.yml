name: PR 9 - Native Image Backend Tests

on:
  pull_request:
    branches: [dev]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/native-image-tests.yml'
  push:
    branches: [feat/native-image-generation]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/native-image-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-image-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python 3.11 backend integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      ABUD_DATABASE_PATH: /tmp/abud-ci-bootstrap.db
      ABUD_BASE_URL: https://example.test
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify runtime and Pillow
        run: |
          python - <<'PY'
          import asyncio
          import sys
          from PIL import Image
          assert sys.version_info[:2] == (3, 11)
          assert hasattr(asyncio, 'timeout')
          print('Python:', sys.version.split()[0])
          print('Pillow:', Image.__version__)
          PY

      - name: Run image-generation integration tests
        run: timeout --signal=TERM --kill-after=15s 8m python -m unittest discover -s tests -p 'test_web_images.py' -v

      - name: Run web-chat integration tests
        run: timeout --signal=TERM --kill-after=15s 8m python -m unittest discover -s tests -p 'test_web_chat.py' -v
