name: PR 9 - Native Image Backend Tests

on:
  pull_request:
    branches: [dev]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'frontend/**'
      - '.github/workflows/native-image-tests.yml'
  push:
    branches: [feat/native-image-generation]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'frontend/**'
      - '.github/workflows/native-image-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-image-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python 3.11 backend integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      ABUD_DATABASE_PATH: /tmp/abud-ci-bootstrap.db
      ABUD_BASE_URL: https://example.test
      DISCORD_OAUTH_CLIENT_ID: ci-discord-client
      DISCORD_OAUTH_CLIENT_SECRET: ci-discord-secret
      GOOGLE_OAUTH_CLIENT_ID: ci-google-client
      GOOGLE_OAUTH_CLIENT_SECRET: ci-google-secret
      ABUD_SESSION_SECRET: ci-session-secret-for-tests-only-not-production
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify runtime and Pillow
        run: |
          python - <<'PY'
          import asyncio
          import sys
          from PIL import Image
          assert sys.version_info[:2] == (3, 11)
          assert hasattr(asyncio, 'timeout')
          print('Python:', sys.version.split()[0])
          print('Pillow:', Image.__version__)
          PY

      - name: Run image-generation integration tests
        run: timeout --signal=TERM --kill-after=15s 8m python -m unittest discover -s tests -p 'test_web_images.py' -v

      - name: Run research and MCP regression tests
        run: timeout --signal=TERM --kill-after=15s 8m python -m unittest discover -s tests -p 'test_research.py' -v
      - name: Run web-chat integration tests
        run: timeout --signal=TERM --kill-after=15s 8m python -m unittest discover -s tests -p 'test_web_chat.py' -v

  frontend:
    name: Frontend unit tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run frontend unit tests
        run: npm --prefix frontend test

      - name: Build frontend
        run: npm --prefix frontend run build

  browser:
    name: Disposable HTTPS browser image E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python and frontend dependencies
        run: |
          python -m pip install -r requirements.txt
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Install isolated Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Run all disposable HTTPS browser E2E suites
        run: |
          export CHROMIUM_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          timeout --signal=TERM --kill-after=15s 8m python tests/run_web_chat_e2e.py web_chat_e2e.cjs
          timeout --signal=TERM --kill-after=15s 8m python tests/run_web_chat_e2e.py web_chat_browser.cjs
          timeout --signal=TERM --kill-after=15s 8m python tests/run_web_chat_e2e.py web_chat_choices.cjs
          timeout --signal=TERM --kill-after=15s 8m python tests/run_web_chat_e2e.py web_chat_images.cjs
          export ABUD_SIDEBAR_PREVIEW_DIR="$RUNNER_TEMP/abud-sidebar-preview"
          timeout --signal=TERM --kill-after=15s 8m python tests/run_web_chat_e2e.py dashboard_sidebar.cjs

      - name: Upload dashboard sidebar preview
        if: github.head_ref == 'feat/toggle-dashboard-sidebar'
        uses: actions/upload-artifact@v4
        with:
          name: abud-sidebar-preview
          path: ${{ runner.temp }}/abud-sidebar-preview/*.png
          if-no-files-found: error
