# Optional overlay for compose.yaml. Voice services have no published ports.
services:
  abud-api:
    networks:
      - voice
    environment:
      ABUD_VOICE_WORKER_URL: http://abud-voice:8001
      ABUD_VOICE_OLLAMA_URL: http://ollama:11434
      ABUD_VOICE_OLLAMA_MODEL: ${ABUD_VOICE_OLLAMA_MODEL:-qwen2.5:1.5b}

  abud-voice:
    networks:
      - voice
    build: ./voice_worker
    restart: unless-stopped
    environment:
      ABUD_WHISPER_MODEL: ${ABUD_WHISPER_MODEL:-base}
      ABUD_PIPER_MODEL: /voices/${ABUD_PIPER_MODEL:-id_ID-news_tts-medium.onnx}
    volumes:
      - whisper-cache:/cache
      - ${ABUD_PIPER_VOICES_DIR:-./voice-models}:/voices:ro

  ollama:
    networks:
      - voice
    image: ollama/ollama:${ABUD_OLLAMA_TAG:-latest}
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_QUEUE: "4"
    volumes:
      - ollama-models:/root/.ollama

networks:
  voice:

volumes:
  whisper-cache:
  ollama-models:
