server:
  port: 2333
  address: 0.0.0.0
lavalink:
  server:
    # Required environment override: LAVALINK_SERVER_PASSWORD; no built-in password.
    sources:
      youtube: false
      soundcloud: true
      bandcamp: true
      twitch: false
      vimeo: false
      nico: false
      http: false
      local: false
    soundcloudSearchEnabled: true
    soundcloudFilterOutPreviewTracks: true
    youtubePlaylistLoadLimit: 1
    playerUpdateInterval: 5
    opusEncodingQuality: 8
    resamplingQuality: MEDIUM
    trackStuckThresholdMs: 10000
logging:
  level:
    root: INFO
    lavalink: INFO
